<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Audio Controller - SUKIPT</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body {
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #16213e;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        h1 { text-align: center; margin-top: 0; font-weight: 500; letter-spacing: 2px; color: #e0e0e0; }
        
        .section { margin-bottom: 30px; }
        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            padding-bottom: 8px;
            border-bottom: 3px solid;
            margin-bottom: 15px;
        }
        .flag-title { border-color: #f39c12; }
        .house-title { border-color: #3498db; }

        .btn-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            color: white;
            flex: 1 0 auto;
        }
        .btn:active { transform: scale(0.95); }
        .btn-flag { background: #f39c12; box-shadow: 0 4px 0 #b36d0a; }
        .btn-house { background: #3498db; box-shadow: 0 4px 0 #1f618d; }
        .btn-playing { 
            outline: 4px solid #2ecc71; 
            outline-offset: 4px;
        }
        
        .btn-stop {
            background: #e74c3c;
            box-shadow: 0 4px 0 #922b21;
            width: 100%;
            padding: 18px;
            font-size: 1.3rem;
            margin-top: 10px;
        }
        
        .controls {
            background: #0f3460;
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
        }
        .volume-slider {
            width: 100%;
            accent-color: #2ecc71;
            height: 8px;
            cursor: pointer;
        }
        .volume-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .status-text {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            opacity: 0.6;
            min-height: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎧 SUKIPT Audio Controller</h1>

    <!-- SECTION 1: FLAG SONG -->
    <div class="section">
        <div class="section-title flag-title">🚩 Flag Song</div>
        <div class="btn-grid">
            <button class="btn btn-flag" id="flagBtn">▶ Play LAGU SUKIPT</button>
        </div>
    </div>

    <!-- SECTION 2: HOUSE MUSIC -->
    <div class="section">
        <div class="section-title house-title">🎶 House Music (19 tracks)</div>
        <div class="btn-grid" id="houseGrid">
            <!-- Buttons will be generated by JavaScript -->
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="volume-label">
            <span>🔊 Master Volume</span>
            <span id="volDisplay">100%</span>
        </div>
        <input type="range" min="0" max="100" value="100" class="volume-slider" id="volumeSlider" />
        
        <button class="btn btn-stop" id="stopAllBtn">⏹ STOP ALL (Fade Out)</button>
        <div class="status-text" id="status">Ready. Click a track to play (fade in/out).</div>
    </div>
</div>

<script>
    // ============================================================
    // 1. YOUR EXACT SONGS - UPDATE THESE PATHS IF NEEDED
    // ============================================================
    const FLAG_SONG = './music/LAGU SUKIPT.mp3';
    
    const HOUSE_SONGS = [
        './music/Darah Muda.mp3',
        './music/Ekstravaganza.mp3',
        './music/Gemuruh.mp3',
        './music/Generasiku.mp3',
        './music/Hall of Fame.mp3',
        './music/Jalur Gemilang.mp3',
        './music/Kembali Bersama.mp3',
        './music/Keranamu.mp3',
        './music/Lagu Untukmu.mp3',
        './music/Malam Ini Kita Punya.mp3',
        './music/MALAYSIA.mp3',
        './music/Merdeka.mp3',
        './music/Negaraku.mp3',
        './music/Pelita.mp3',
        './music/Revolusi.mp3',
        './music/Situasi.mp3',
        './music/Standing In The Eyes Of The World.mp3',
        './music/Teguh Mimpi.mp3',
        './music/Warisan.mp3'
    ];

    // ============================================================
    // 2. CORE AUDIO ENGINE (Web Audio API with Fades)
    // ============================================================
    let audioCtx = null;
    let currentSources = []; // Active { source, gain, audioEl }
    let masterGain = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = document.getElementById('volumeSlider').value / 100;
            masterGain.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function fadeOutAll(duration = 1.5, callback = null) {
        if (currentSources.length === 0) {
            if (callback) callback();
            return;
        }

        const promises = currentSources.map((item) => {
            return new Promise((resolve) => {
                const gain = item.gain;
                const startVal = gain.gain.value;
                const startTime = audioCtx.currentTime;
                gain.gain.setValueAtTime(startVal, startTime);
                gain.gain.linearRampToValueAtTime(0, startTime + duration);
                
                setTimeout(() => {
                    if (item.audioEl) {
                        item.audioEl.pause();
                        item.audioEl.currentTime = 0;
                    }
                    try { item.source.disconnect(); } catch(e) {}
                    resolve();
                }, duration * 1000 + 50);
            });
        });

        Promise.all(promises).then(() => {
            currentSources = [];
            if (callback) callback();
            updateStatus('All stopped (faded out)');
        });
    }

    function playWithFade(audioElement, fadeInDuration = 1.5) {
        initAudio();
        
        if (currentSources.length > 0) {
            fadeOutAll(1.2, () => {
                internalPlay(audioElement, fadeInDuration);
            });
        } else {
            internalPlay(audioElement, fadeInDuration);
        }
    }

    function internalPlay(audioElement, fadeInDuration) {
        if (audioCtx.state === 'suspended') audioCtx.resume();

        audioElement.currentTime = 0;
        
        const source = audioCtx.createMediaElementSource(audioElement);
        const gainNode = audioCtx.createGain();
        
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        
        source.connect(gainNode);
        gainNode.connect(masterGain);
        
        audioElement.play().catch(e => console.warn("Play error:", e));
        
        gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + fadeInDuration);
        
        currentSources.push({ source, gain: gainNode, audioEl: audioElement });
        
        updateStatus(`▶ Playing: ${audioElement.src.split('/').pop()}`);
    }

    function stopWithFade(audioElement, duration = 1.2) {
        const idx = currentSources.findIndex(item => item.audioEl === audioElement);
        if (idx === -1) return;

        const item = currentSources[idx];
        const gain = item.gain;
        const startVal = gain.gain.value;
        const startTime = audioCtx.currentTime;
        gain.gain.setValueAtTime(startVal, startTime);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);

        setTimeout(() => {
            if (item.audioEl) {
                item.audioEl.pause();
                item.audioEl.currentTime = 0;
            }
            try { item.source.disconnect(); } catch(e) {}
        }, duration * 1000 + 50);

        currentSources.splice(idx, 1);
        updateStatus('⏸ Stopped (faded out)');
    }

    // Master Volume
    document.getElementById('volumeSlider').addEventListener('input', (e) => {
        const val = e.target.value / 100;
        document.getElementById('volDisplay').textContent = Math.round(e.target.value) + '%';
        if (masterGain) {
            masterGain.gain.setValueAtTime(val, audioCtx.currentTime);
        }
    });

    function updateStatus(msg) {
        document.getElementById('status').textContent = msg;
    }

    // ============================================================
    // 3. BUILD THE UI
    // ============================================================
    
    // --- Flag Song ---
    const flagBtn = document.getElementById('flagBtn');
    const flagAudio = new Audio(FLAG_SONG);

    flagBtn.addEventListener('click', () => {
        initAudio();
        const isActive = currentSources.some(item => item.audioEl === flagAudio);
        
        if (isActive) {
            stopWithFade(flagAudio);
            flagBtn.textContent = '▶ Play LAGU SUKIPT';
            flagBtn.classList.remove('btn-playing');
        } else {
            playWithFade(flagAudio);
            flagBtn.textContent = '⏹ Stop LAGU SUKIPT';
            flagBtn.classList.add('btn-playing');
            // Remove playing state from any house buttons
            document.querySelectorAll('.btn-house').forEach(b => b.classList.remove('btn-playing'));
        }
    });

    // --- House Music ---
    const houseGrid = document.getElementById('houseGrid');

    HOUSE_SONGS.forEach((path, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-house';
        // Show a short name (remove './music/' and .mp3)
        const displayName = path.replace('./music/', '').replace('.mp3', '');
        btn.textContent = `🎵 ${displayName}`;
        
        const audioEl = new Audio(path);

        btn.addEventListener('click', () => {
            initAudio();
            const isActive = currentSources.some(item => item.audioEl === audioEl);
            
            if (isActive) {
                stopWithFade(audioEl);
                btn.classList.remove('btn-playing');
            } else {
                document.querySelectorAll('.btn-house').forEach(b => b.classList.remove('btn-playing'));
                playWithFade(audioEl);
                btn.classList.add('btn-playing');
                // If flag was playing, remove its playing state
                flagBtn.textContent = '▶ Play LAGU SUKIPT';
                flagBtn.classList.remove('btn-playing');
            }
        });

        houseGrid.appendChild(btn);
    });

    // --- Stop All Button ---
    document.getElementById('stopAllBtn').addEventListener('click', () => {
        if (currentSources.length === 0) return;
        fadeOutAll(1.5, () => {
            flagBtn.textContent = '▶ Play LAGU SUKIPT';
            flagBtn.classList.remove('btn-playing');
            document.querySelectorAll('.btn-house').forEach(b => b.classList.remove('btn-playing'));
            updateStatus('⏹ All stopped');
        });
    });

    // --- Click to initialize audio context ---
    document.addEventListener('click', initAudio);

    console.log('🎛 SUKIPT Audio Controller Loaded!');
    console.log(`Loaded ${HOUSE_SONGS.length} house tracks + 1 flag track.`);
</script>
</body>
</html>

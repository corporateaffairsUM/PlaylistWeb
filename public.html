<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- NO CSP, NO AUDIO -->
    <title>SUKIPT 2026 - Projector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        #slide-display {
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }
        #slide-display img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border: none;
            border-radius: 0;
        }
    </style>
</head>
<body>
    <div id="slide-display">
        <img id="public-slide" src="" alt="Current slide" />
    </div>

    <script>
        // ============================================================
        // 1. BROADCAST CHANNEL – only for slide updates
        // ============================================================
        const channel = new BroadcastChannel('presenter_hdmi');
        const slideImg = document.getElementById('public-slide');

        // ============================================================
        // 2. LISTEN FOR SLIDE NAVIGATION COMMANDS
        // ============================================================
        channel.onmessage = (event) => {
            const data = event.data;
            if (!data) return;
            if (data.action === 'navigateSlide') {
                slideImg.src = data.dataURL;
                document.title = `📺 Slide ${data.index + 1}`;
            }
        };

        // ============================================================
        // 3. INIT
        // ============================================================
        console.log('📺 Projector ready – waiting for slides.');
    </script>
</body>
</html>

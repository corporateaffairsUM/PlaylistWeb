<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUKIPT 2026 - Projector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1120;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: sans-serif;
        }
        #slide-display {
            width: 96vw;
            height: 94vh;
            background: #0f172a;
            border-radius: 32px;
            border: 2px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px black;
        }
        #slide-display img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 16px;
        }
        /* Hidden audio engine – no UI at all */
        .hidden-audio { display: none; }
        .status-badge {
            position: fixed;
            bottom: 16px;
            right: 24px;
            color: #1e293b;
            font-size: 0.8rem;
            font-family: monospace;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div id="slide-display">
        <img id="public-slide" src="" alt="Current slide" />
    </div>

    <!-- Hidden audio elements will be created dynamically -->
    <div class="status-badge">🔊 HDMI LIVE</div>

    <script>
        // ============================================================
        // 1. SONG LISTS (same as presenter)
        // ============================================================
        const FLAG_SONG = './music/Lagu Universiti/LAGU SUKIPT.mp3';
        const HOUSE_SONGS = [
            './music/Darah Muda.mp3','./music/Ekstravaganza.mp3','./music/Gemuruh.mp3',
            './music/Generasiku.mp3','./music/Hall of Fame.mp3','./music/Jalur Gemilang.mp3',
            './music/Kembali Bersama.mp3','./music/Keranamu.mp3','./music/Lagu Untukmu.mp3',
            './music/Malam Ini Kita Punya.mp3','./music/MALAYSIA.mp3','./music/Merdeka.mp3',
            './music/Negaraku.mp3','./music/Pelita.mp3','./music/Revolusi.mp3',
            './music/Situasi.mp3','./music/Standing In The Eyes Of The World.mp3',
            './music/Teguh Mimpi.mp3','./music/Warisan.mp3'
        ];
        const CONTINGENT_SONGS = [
            './music/Lagu Universiti/ALAM.MP3','./music/Lagu Universiti/City University.mp3',
            './music/Lagu Universiti/IIUM.mp3','./music/Lagu Universiti/Kolej Komuniti .mp3',
            './music/Lagu Universiti/KPTM.wav','./music/Lagu Universiti/MAHSA.mp3',
            './music/Lagu Universiti/MMU.mp3','./music/Lagu Universiti/MSU.mp3',
            './music/Lagu Universiti/Politeknik Malaysia.mp3','./music/Lagu Universiti/TESDEC.mp3',
            './music/Lagu Universiti/UC TATI.mp3','./music/Lagu Universiti/UCAM.mp3',
            './music/Lagu Universiti/UCSI.mp3','./music/Lagu Universiti/UiTM.mp3',
            './music/Lagu Universiti/UKM.mp3','./music/Lagu Universiti/UMK.mp3',
            './music/Lagu Universiti/UMPSA.mp3','./music/Lagu Universiti/UMS.mpeg',
            './music/Lagu Universiti/UMT.mp3','./music/Lagu Universiti/UniKL.mp3',
            './music/Lagu Universiti/UNIKOP.mpeg','./music/Lagu Universiti/UniMAP.mp3',
            './music/Lagu Universiti/UNIMAS.mp3','./music/Lagu Universiti/UNIRAZAK.mp3',
            './music/Lagu Universiti/UNISEL.mp3','./music/Lagu Universiti/UniSZA.mp3',
            './music/Lagu Universiti/UNITAR.mp3','./music/Lagu Universiti/UNITEN.mp3',
            './music/Lagu Universiti/Universiti Malaya.mp3','./music/Lagu Universiti/UPM.mp3',
            './music/Lagu Universiti/UPNM.mp3','./music/Lagu Universiti/UPSI.mp3',
            './music/Lagu Universiti/UPTM.mp3','./music/Lagu Universiti/USIM.mp3',
            './music/Lagu Universiti/USM.mp3','./music/Lagu Universiti/UTeM.mp3',
            './music/Lagu Universiti/UTHM.mp3','./music/Lagu Universiti/UTM.mp3',
            './music/Lagu Universiti/UTP.mp3','./music/Lagu Universiti/UUM.mp3'
        ];

        // ============================================================
        // 2. AUDIO ENGINE STATE
        // ============================================================
        let audioCtx = null;
        let masterGain = null;
        let currentSources = []; // { source, gain, audioEl, url, isHouse }
        let activeAudioEl = null;
        let activeUrl = null;

        // House state
        let houseState = {
            index: 0,
            time: 0,
            isActive: false,
            isPlaying: false
        };

        // Custom uploaded blob URLs (to keep track)
        let customUrls = [];

        // ============================================================
        // 3. BROADCAST CHANNEL
        // ============================================================
        const channel = new BroadcastChannel('presenter_hdmi');

        // ============================================================
        // 4. AUDIO INIT
        // ============================================================
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 1.0; // default, will be set from volume
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // ============================================================
        // 5. CORE AUDIO FUNCTIONS
        // ============================================================
        function fadeOutAll(duration = 1.5, callback = null) {
            if (currentSources.length === 0) {
                if (callback) callback();
                return;
            }
            const promises = currentSources.map((item) => {
                return new Promise((resolve) => {
                    const gain = item.gain;
                    const startVal = gain.gain.value;
                    const startTime = audioCtx.currentTime;
                    gain.gain.setValueAtTime(startVal, startTime);
                    gain.gain.linearRampToValueAtTime(0, startTime + duration);
                    setTimeout(() => {
                        if (item.audioEl) {
                            item.audioEl.pause();
                            item.audioEl.currentTime = 0;
                        }
                        try { item.source.disconnect(); } catch(e) {}
                        resolve();
                    }, duration * 1000 + 50);
                });
            });
            Promise.all(promises).then(() => {
                currentSources = [];
                activeAudioEl = null;
                activeUrl = null;
                if (callback) callback();
                sendStatus('All stopped');
                updateProgressBar(); // will send progress update
            });
        }

        function internalPlayFresh(url, startTime = 0, fadeInDuration = 1.5, isHouse = false) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const audioEl = new Audio(url);
            audioEl.preload = 'auto';
            audioEl.currentTime = startTime;

            const source = audioCtx.createMediaElementSource(audioEl);
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            source.connect(gainNode);
            gainNode.connect(masterGain);

            audioEl.play().catch(e => { if (e.name !== 'AbortError') console.warn(e); });
            gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + fadeInDuration);

            const item = { source, gain: gainNode, audioEl, url, isHouse };
            currentSources.push(item);
            activeAudioEl = audioEl;
            activeUrl = url;

            audioEl.addEventListener('timeupdate', () => {
                if (activeAudioEl === audioEl) updateProgressBar();
            });
            audioEl.addEventListener('loadedmetadata', () => {
                if (activeAudioEl === audioEl) updateProgressBar();
            });
            audioEl.addEventListener('ended', () => {
                if (isHouse && currentSources.length > 0 && currentSources[0]?.audioEl === audioEl) {
                    handleHouseEnded();
                }
            });

            const label = getDisplayName(url);
            sendNowPlaying(label);
            sendStatus(`Playing: ${label}`);
            updateProgressBar();
            // Send track playing state for UI highlight
            sendTrackPlaying(url);
            if (isHouse) {
                houseState.isPlaying = true;
                sendHouseState();
            } else {
                // if flag, send flag state
                if (url === FLAG_SONG) sendFlagState(true);
            }
            return item;
        }

        function playTrack(url, startTime = 0, isHouse = false) {
            initAudio();

            // Save house state if currently playing
            if (currentSources.length > 0 && houseState.isPlaying) {
                const houseItem = currentSources.find(s => s.isHouse);
                if (houseItem) {
                    houseState.time = houseItem.audioEl.currentTime;
                    houseState.index = HOUSE_SONGS.indexOf(houseItem.url);
                    if (houseState.index === -1) houseState.index = 0;
                }
            }

            if (isHouse) {
                houseState.index = HOUSE_SONGS.indexOf(url);
                if (houseState.index === -1) houseState.index = 0;
                houseState.time = startTime;
                houseState.isActive = true;
                houseState.isPlaying = true;
            } else {
                // if playing a non-house track, pause house
                if (houseState.isPlaying) {
                    const houseItem = currentSources.find(s => s.isHouse);
                    if (houseItem) {
                        houseState.time = houseItem.audioEl.currentTime;
                    }
                    houseState.isPlaying = false;
                }
            }

            if (currentSources.length > 0) {
                fadeOutAll(1.2, () => {
                    internalPlayFresh(url, startTime, 1.5, isHouse);
                });
            } else {
                internalPlayFresh(url, startTime, 1.5, isHouse);
            }
        }

        function stopTrack(url, duration = 1.2) {
            const idx = currentSources.findIndex(item => item.url === url);
            if (idx === -1) return false;
            const item = currentSources[idx];
            const gain = item.gain;
            const startVal = gain.gain.value;
            const startTime = audioCtx.currentTime;
            gain.gain.setValueAtTime(startVal, startTime);
            gain.gain.linearRampToValueAtTime(0, startTime + duration);
            setTimeout(() => {
                if (item.audioEl) { item.audioEl.pause(); item.audioEl.currentTime = 0; }
                try { item.source.disconnect(); } catch(e) {}
            }, duration * 1000 + 50);
            currentSources.splice(idx, 1);
            if (activeAudioEl === item.audioEl) {
                activeAudioEl = null;
                activeUrl = null;
                sendNowPlaying('Nothing playing');
                updateProgressBar();
            }
            sendStatus('Stopped');
            return true;
        }

        function isPlaying(url) {
            return currentSources.some(item => item.url === url);
        }

        function getDisplayName(url) {
            if (url.startsWith('blob:')) {
                // Try to find from custom upload list? We'll just show 'Custom'
                return 'Custom Upload';
            }
            let name = url.split('/').pop().replace(/\.[^/.]+$/, '').replace(/%20/g, ' ');
            return name;
        }

        // ============================================================
        // 6. HOUSE AUTO-NEXT
        // ============================================================
        function handleHouseEnded() {
            if (!houseState.isActive) return;
            let nextIndex = houseState.index + 1;
            if (nextIndex >= HOUSE_SONGS.length) nextIndex = 0;
            houseState.index = nextIndex;
            houseState.time = 0;
            const nextUrl = HOUSE_SONGS[nextIndex];
            if (currentSources.length > 0) {
                fadeOutAll(0.8, () => {
                    internalPlayFresh(nextUrl, 0, 1.5, true);
                });
            } else {
                internalPlayFresh(nextUrl, 0, 1.5, true);
            }
        }

        // ============================================================
        // 7. SEND STATUS UPDATES TO PRESENTER
        // ============================================================
        function sendStatus(msg) {
            channel.postMessage({ type: 'status', msg });
        }

        function sendNowPlaying(label) {
            channel.postMessage({ type: 'nowPlaying', label });
        }

        function sendTrackPlaying(url) {
            channel.postMessage({ type: 'trackPlaying', url: url || null });
        }

        function sendFlagState(isPlaying) {
            channel.postMessage({ type: 'flagState', isPlaying });
        }

        function sendHouseState() {
            channel.postMessage({
                type: 'houseState',
                isPlaying: houseState.isPlaying,
                index: houseState.index,
                time: houseState.time
            });
        }

        function updateProgressBar() {
            if (activeAudioEl && !isNaN(activeAudioEl.duration) && activeAudioEl.duration > 0) {
                const current = activeAudioEl.currentTime;
                const duration = activeAudioEl.duration;
                channel.postMessage({ type: 'progress', currentTime: current, duration });
            } else {
                channel.postMessage({ type: 'progress', currentTime: 0, duration: 0 });
            }
        }

        // ============================================================
        // 8. COMMAND HANDLER
        // ============================================================
        channel.onmessage = (event) => {
            const data = event.data;
            if (!data) return;
            const action = data.action;

            switch (action) {
                case 'toggleFlag': {
                    if (isPlaying(FLAG_SONG)) {
                        stopTrack(FLAG_SONG);
                        sendFlagState(false);
                        if (houseState.isActive) {
                            // resume house if it was active? we'll just set house not playing
                            houseState.isPlaying = false;
                            sendHouseState();
                        }
                    } else {
                        // stop other tracks and play flag
                        if (houseState.isPlaying) {
                            const houseItem = currentSources.find(s => s.isHouse);
                            if (houseItem) houseState.time = houseItem.audioEl.currentTime;
                            houseState.isPlaying = false;
                        }
                        playTrack(FLAG_SONG, 0, false);
                        sendFlagState(true);
                        sendHouseState();
                    }
                    break;
                }
                case 'playHouse': {
                    const { url, index } = data;
                    houseState.index = index;
                    houseState.time = 0;
                    houseState.isActive = true;
                    houseState.isPlaying = true;
                    playTrack(url, 0, true);
                    sendHouseState();
                    break;
                }
                case 'resumeHouse': {
                    if (houseState.isPlaying && currentSources.some(s => s.isHouse)) {
                        // already playing
                        break;
                    }
                    if (!houseState.isActive) {
                        houseState.index = 0;
                        houseState.time = 0;
                        houseState.isActive = true;
                    }
                    houseState.isPlaying = true;
                    // if flag is playing, stop it first
                    if (isPlaying(FLAG_SONG)) {
                        fadeOutAll(1.2, () => {
                            const url = HOUSE_SONGS[houseState.index];
                            playTrack(url, houseState.time, true);
                            sendHouseState();
                            sendFlagState(false);
                        });
                    } else if (currentSources.length > 0) {
                        fadeOutAll(1.2, () => {
                            const url = HOUSE_SONGS[houseState.index];
                            playTrack(url, houseState.time, true);
                            sendHouseState();
                        });
                    } else {
                        const url = HOUSE_SONGS[houseState.index];
                        playTrack(url, houseState.time, true);
                        sendHouseState();
                    }
                    break;
                }
                case 'stopAll': {
                    const houseItem = currentSources.find(s => s.isHouse);
                    if (houseItem) {
                        houseState.time = houseItem.audioEl.currentTime;
                        houseState.isPlaying = false;
                    }
                    fadeOutAll(1.5, () => {
                        sendNowPlaying('Nothing playing');
                        sendStatus('⏹ All stopped');
                        updateProgressBar();
                        sendFlagState(false);
                        sendHouseState();
                        sendTrackPlaying(null);
                    });
                    break;
                }
                case 'setVolume': {
                    if (masterGain) {
                        masterGain.gain.setValueAtTime(data.value, audioCtx.currentTime);
                        channel.postMessage({ type: 'volume', value: data.value });
                    }
                    break;
                }
                case 'seek': {
                    if (activeAudioEl && !isNaN(activeAudioEl.duration) && activeAudioEl.duration > 0) {
                        activeAudioEl.currentTime = data.percent * activeAudioEl.duration;
                        updateProgressBar();
                    }
                    break;
                }
                case 'playCustom': {
                    const { url } = data;
                    // stop house if playing
                    if (houseState.isPlaying) {
                        const houseItem = currentSources.find(s => s.isHouse);
                        if (houseItem) houseState.time = houseItem.audioEl.currentTime;
                        houseState.isPlaying = false;
                        sendHouseState();
                    }
                    playTrack(url, 0, false);
                    sendFlagState(false);
                    sendTrackPlaying(url);
                    break;
                }
                case 'playContingent': {
                    const { url } = data;
                    if (houseState.isPlaying) {
                        const houseItem = currentSources.find(s => s.isHouse);
                        if (houseItem) houseState.time = houseItem.audioEl.currentTime;
                        houseState.isPlaying = false;
                        sendHouseState();
                    }
                    playTrack(url, 0, false);
                    sendFlagState(false);
                    sendTrackPlaying(url);
                    break;
                }
                case 'togglePlayPause': {
                    if (activeAudioEl) {
                        if (activeAudioEl.paused) {
                            activeAudioEl.play();
                        } else {
                            activeAudioEl.pause();
                        }
                        // send updated playing state? not critical
                    }
                    break;
                }
                case 'navigateSlide': {
                    const { index, dataURL } = data;
                    document.getElementById('public-slide').src = dataURL;
                    document.title = `📺 Slide ${index+1}`;
                    break;
                }
                default:
                    console.warn('Unknown command:', action);
            }
        };

        // ============================================================
        // 9. INIT
        // ============================================================
        // Send initial state
        sendNowPlaying('Ready');
        sendStatus('Waiting for presenter...');
        sendFlagState(false);
        sendHouseState();

        // Periodically send progress updates
        setInterval(() => {
            if (activeAudioEl && !activeAudioEl.paused) {
                updateProgressBar();
            }
        }, 500);

        console.log('📺 Projector audio engine ready.');
        console.log(`House: ${HOUSE_SONGS.length}, Contingent: ${CONTINGENT_SONGS.length}, Flag: ${FLAG_SONG}`);
    </script>
</body>
</html>
